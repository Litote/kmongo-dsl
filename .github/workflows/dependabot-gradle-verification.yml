name: Update Gradle verification metadata

on:
  pull_request_target:
    branches: [ main ]
    paths:
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'

jobs:
  update-verification-metadata:
    # the author of the pull request, not github.actor (the last user who triggered the event: forgeable)
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: Litote/ci/.github/workflows/gradle-verification.yml@c111317515db0963d8dfebb7821cefbc92d34897 # v0.9.0
    with:
      java-version: '17'
      # the tasks run by the CI (the same as the ones used to generate the file)
      gradle-tasks: build dokkaGenerate jacocoAggregatedReport publishToMavenLocal
    secrets:
      RELEASE_PLEASE_APP_ID: ${{ secrets.RELEASE_PLEASE_APP_ID }}
      RELEASE_PLEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
