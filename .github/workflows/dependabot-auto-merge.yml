name: Dependabot auto-merge

on:
  # pull_request_target gives access to the GitHub App secrets, which pull_request
  # events from Dependabot do not. No PR code is checked out or executed here.
  pull_request_target:
    branches: [ main ]
    types: [ opened, reopened ]

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    uses: Litote/ci/.github/workflows/dependabot-auto-merge.yml@3f4cc1e08fdf4fa3c66a8e2c6a1e46c5992a708c # v0.7.0
    with:
      ecosystems: gradle
      # the minor version of the MongoDB driver sets the kmongo-dsl version, see CONTRIBUTING.md
      exclude-dependencies: org.mongodb:*
    secrets:
      RELEASE_PLEASE_APP_ID: ${{ secrets.RELEASE_PLEASE_APP_ID }}
      RELEASE_PLEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
